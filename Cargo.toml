[package]
name = "log-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.52.2", features = ["full"] }

[dev-dependencies]
tempfile = "3"
